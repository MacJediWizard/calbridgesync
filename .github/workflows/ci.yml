name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PRs share a group per ref so a new push cancels the superseded run.
  # Pushes to main get a unique group per commit: GitHub keeps only one
  # pending run per group and cancels it when a newer run is queued, so a
  # shared main group would drop runs when several PRs merge back to back.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest 1.27.x patch, matching the golang:1.27-alpine Docker build.
          # go.mod declares only the minimum (`go 1.26.0`), not the toolchain we ship.
          go-version: '1.27.x'
          check-latest: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  web:
    name: Web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest 1.27.x patch, matching the golang:1.27-alpine Docker build.
          # go.mod declares only the minimum (`go 1.26.0`), not the toolchain we ship.
          go-version: '1.27.x'
          check-latest: true
      # Blocking: any vulnerability reachable from our code fails the build.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Advisory until PR-39 (after the PR-37 dead-code sweep) makes it blocking.
  golangci-lint:
    name: golangci-lint (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest 1.27.x patch, matching the golang:1.27-alpine Docker build.
          # go.mod declares only the minimum (`go 1.26.0`), not the toolchain we ship.
          go-version: '1.27.x'
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: v2.14.0
