<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - CalBridgeSync</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #111827;
            color: #e5e7eb;
        }
        main { max-width: 28rem; width: 100%; text-align: center; }
        h1 { margin: 0; font-size: 2rem; color: #f87171; }
        p { margin: 1rem 0 2rem; font-size: 1.125rem; color: #9ca3af; overflow-wrap: anywhere; }
        a {
            display: inline-block;
            margin: 0 0.25rem;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            color: #fff;
            background: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover { background: #4f46e5; }
    </style>
</head>
<body>
    <main>
        <h1>Something went wrong</h1>
        <p>{{if .error}}{{.error}}{{else}}An unexpected error occurred.{{end}}</p>
        <a href="/auth/login">Sign in again</a>
        <a href="/">Home</a>
    </main>
</body>
</html>
